        // Função para renderizar os projetos
        function renderizarProjetos() {
            const container = document.getElementById('projectsContainer');
            
            // Limpa o container
            container.innerHTML = '';

            if (projetosNode.length === 0) {
                container.innerHTML = `
                    <div class="add-project-hint">
                        <i class="fa-solid fa-code empty-project-icon" aria-hidden="true"></i>
                        <p>Nenhum projeto adicionado ainda.</p>
                        <p class="empty-project-details">Edite o arquivo <strong>projetos-node.html</strong> e adicione seus projetos no array <code>projetosNode</code>.</p>
                    </div>
                `;
                return;
            }

            projetosNode.forEach(projeto => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <div class="card-icon icon-node"><i class="fa-brands fa-node"></i></div>
                    <span class="card-tag">Node.js</span>
                    <h4><a href="${projeto.link}" target="_blank" rel="noopener noreferrer" class="card-link project-title">${projeto.nome}</a></h4>
                    <p>${projeto.descricao}</p>
                    <div class="card-links">
                        <a href="${projeto.link}" target="_blank" rel="noopener noreferrer" class="card-link"><i class="fa-brands fa-github" aria-hidden="true"></i> Ver repositório</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Renderiza ao carregar a página
        document.addEventListener('DOMContentLoaded', renderizarProjetos);
    </script>
